---

- name: Install Claude Code via native installer
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  when: not ansible_check_mode

- name: Ensure ~/.local/bin is in PATH in .zshrc
  lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    regexp: 'export PATH=.*\.local/bin'
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: yes

- name: Ensure ~/.claude/skills directory exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory
    mode: '0755'

- name: Symlink Claude config files
  file:
    src: "{{ (role_path + '/../../resources/claude/' + item) | realpath }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item }}"
    state: link
    force: yes
  loop:
    - CLAUDE.md
    - RTK.md
    - commit-workflow.md
    - settings.json

- name: Symlink Claude skills
  file:
    src: "{{ (role_path + '/../../resources/claude/skills/' + item) | realpath }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/skills/{{ item }}"
    state: link
    force: yes
  loop:
    - adapt
    - animate
    - audit
    - clarify
    - colorize
    - delight
    - distill
    - git-commit-planner
    - gitmoji-commits
    - mr-description
    - normalize
    - onboard
    - polish
    - quieter
