---

# Per package: unstow (cleanup prior links from this stow dir), move aside anything
# still blocking the target (files, symlinks, and broken symlinks — `[ -e ]` is false
# for dangling links, so we also test `[ -L ]`), then restow.

- name: Restow each package (unstow, resolve conflicts, stow)
  shell: |
    set -euo pipefail
    home="{{ ansible_facts['env']['HOME'] }}"
    pkg="{{ item }}"
    stowdir="$home/.dotfiles/src/resources"
    ts="{{ ansible_facts['date_time']['epoch'] }}"
    backup_dir="$home/.dotfiles-backups/$ts/$pkg"
    cd "$stowdir"
    stow -D -t "$home" "$pkg" || true
    mkdir -p "$backup_dir"
    src="$stowdir/$pkg"
    for f in $(cd "$src" && find . -mindepth 1 -maxdepth 1 -printf '%P\n'); do
      tgt="$home/$f"
      if [ -e "$tgt" ] || [ -L "$tgt" ]; then
        mkdir -p "$(dirname "$backup_dir/$f")"
        mv "$tgt" "$backup_dir/$f"
      fi
    done
    stow -R -t "$home" "$pkg"
  args:
    executable: /bin/bash
  loop: "{{ lookup('fileglob', playbook_dir + '/../resources/*') | map('basename') | list }}"
  when: item is defined
