  command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete.bak-{{ ansible_facts['date_time']['epoch'] }}"
