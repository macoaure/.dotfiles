---

- hosts: localhost

  # If you need to provide a sudo password, run:
  # ansible-playbook src/setup.yml --ask-become-pass
  # Or set up passwordless sudo for your user

  tasks:

    - name: Ensure Git is installed
      package:
        name: git
        state: present
      become: true

    - name: Ensure Nano is installed
      package:
        name: nano
        state: present
      become: true

    - name: Ensure Zsh is installed
      package:
        name: zsh
        state: present
      become: true

    - name: Check for existing ~/.zshrc
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
      register: zshrc_stat
      tags: stow

    - name: Create backup dir for existing ~/.zshrc (if present)
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.dotfiles-backups/{{ ansible_date_time.epoch }}/zsh"
        state: directory
        mode: '0755'
      when: zshrc_stat.stat.exists and not zshrc_stat.stat.islnk
      tags: stow

    - name: Backup existing ~/.zshrc if it's a regular file (not a symlink)
      copy:
        src: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        dest: "{{ ansible_facts['env']['HOME'] }}/.dotfiles-backups/{{ ansible_date_time.epoch }}/zsh/.zshrc"
        remote_src: yes
        force: yes
      when: zshrc_stat.stat.exists and not zshrc_stat.stat.islnk
      tags: stow

    - name: Remove existing ~/.zshrc blocking stow
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        state: absent
      when: zshrc_stat.stat.exists and not zshrc_stat.stat.islnk
      tags: stow

    - name: Ensure Stow is installed
      package:
        name: stow
        state: present
      become: true

    - name: Install Ghostty terminal emulator
      block:
        - name: Install Ghostty on Ubuntu/Debian from GitHub release
          shell: |
            if ! command -v ghostty >/dev/null 2>&1; then
              # Try to install from official Ghostty binary release (works on all Linux)
              echo "Installing Ghostty from official binary release..."
              curl -fsSL https://github.com/ghostty-org/ghostty/releases/latest/download/ghostty-linux-x86_64.tar.gz | tar -xzf - -C /tmp
              sudo mv /tmp/ghostty-linux-x86_64/ghostty /usr/local/bin/ghostty
              sudo chmod +x /usr/local/bin/ghostty
              echo "Installed Ghostty from official binary release"
            fi
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: ghostty

        - name: Install Ghostty on Fedora/RHEL
          package:
            name: ghostty
            state: present
          become: true
          when: ansible_facts.get("distribution") in ['Fedora', 'RedHat', 'CentOS', 'AlmaLinux', 'Rocky']
          tags: ghostty

        - name: Install Ghostty on Arch Linux
          package:
            name: ghostty
            state: present
          become: true
          when: ansible_facts.get("distribution") in ['Archlinux', 'Manjaro', 'EndeavourOS']
          tags: ghostty

        - name: Install Ghostty on SUSE
          package:
            name: ghostty
            state: present
          become: true
          when: ansible_facts.get("distribution") in ['openSUSE', 'SLES']
          tags: ghostty

        - name: Install Ghostty on Alpine
          package:
            name: ghostty
            state: present
          become: true
          when: ansible_facts.get("distribution") == 'Alpine'
          tags: ghostty
      rescue:
        - name: Try installing Ghostty from official binary release
          shell: |
            if ! command -v ghostty >/dev/null 2>&1; then
              curl -fsSL https://github.com/ghostty-org/ghostty/releases/latest/download/ghostty-linux-x86_64.tar.gz | tar -xzf - -C /tmp
              sudo mv /tmp/ghostty-linux-x86_64/ghostty /usr/local/bin/ghostty
              sudo chmod +x /usr/local/bin/ghostty
            fi
          become: true
          ignore_errors: yes
          tags: ghostty

        - name: Warn about Ghostty installation failure
          debug:
            msg: "Ghostty installation failed. Please install manually from https://ghostty.org/docs/install"
          tags: ghostty

    - name: Set Ghostty as default terminal
      alternatives:
        name: x-terminal-emulator
        path: /usr/bin/ghostty
      become: true
      when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
      ignore_errors: yes
      tags: ghostty

    - name: Set Ghostty as default terminal on Arch-based systems
      shell: |
        # Update MIME type associations for terminal
        if command -v xdg-mime >/dev/null 2>&1; then
          xdg-mime default ghostty.desktop application/x-terminal
        fi
        # Also set the TERMINAL environment variable system-wide
        if [ ! -f /etc/profile.d/terminal.sh ]; then
          echo 'export TERMINAL=ghostty' | sudo tee /etc/profile.d/terminal.sh >/dev/null
        fi
      become: true
      when: ansible_facts.get("distribution") in ['Archlinux', 'Manjaro', 'EndeavourOS']
      ignore_errors: yes
      tags: ghostty

    - name: Set Ghostty as default terminal on Alpine
      alternatives:
        name: x-terminal-emulator
        path: /usr/bin/ghostty
      become: true
      when: ansible_facts.get("distribution") == 'Alpine'
      ignore_errors: yes
      tags: ghostty

    - name: Check for existing Oh My Zsh install
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: ohmyzsh_stat

    - name: Backup existing Oh My Zsh if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: ohmyzsh_stat.stat.exists

    - name: Install Oh My Zsh
      shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"

    - name: Install Docker and Docker Compose
      block:
        - name: Add Docker GPG key (Ubuntu/Debian)
          shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: docker

        - name: Add Docker repository (Ubuntu/Debian)
          shell: echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu focal stable' | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: docker

        - name: Install Docker Engine (Ubuntu/Debian)
          shell: sudo apt-get update && sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: docker

        - name: Add user to docker group (Ubuntu/Debian)
          shell: sudo usermod -aG docker $USER
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: docker

        - name: Install Docker on Fedora
          shell: |
            # Install Docker
            sudo dnf -y install dnf-plugins-core
            sudo dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
            sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            
            # Start and enable Docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add user to docker group
            sudo usermod -aG docker $USER
          become: true
          when: ansible_facts.get("distribution") == 'Fedora'
          tags: docker

        - name: Install Docker on RHEL/CentOS
          shell: |
            # Install Docker
            sudo yum install -y yum-utils
            sudo yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
            sudo yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            
            # Start and enable Docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add user to docker group
            sudo usermod -aG docker $USER
          become: true
          when: ansible_facts.get("distribution") in ['RedHat', 'CentOS', 'AlmaLinux', 'Rocky']
          tags: docker

        - name: Install Docker on Arch Linux
          shell: |
            # Install Docker
            sudo pacman -S --noconfirm docker docker-compose
            
            # Start and enable Docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add user to docker group
            sudo usermod -aG docker $USER
          become: true
          when: ansible_facts.get("distribution") in ['Archlinux', 'Manjaro', 'EndeavourOS']
          tags: docker

        - name: Install Docker on SUSE
          shell: |
            # Install Docker
            sudo zypper install -y docker docker-compose
            
            # Start and enable Docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add user to docker group
            sudo usermod -aG docker $USER
          become: true
          when: ansible_facts.get("distribution") in ['openSUSE', 'SLES']
          tags: docker

        - name: Install Docker on Alpine
          shell: |
            # Install Docker
            sudo apk add docker docker-compose
            
            # Start and enable Docker
            sudo rc-update add docker boot
            sudo service docker start
            
            # Add user to docker group
            sudo addgroup $USER docker
          become: true
          when: ansible_facts.get("distribution") == 'Alpine'
          tags: docker
      rescue:
        - name: Warn about Docker installation failure
          debug:
            msg: "Docker installation failed. Please install manually from https://docs.docker.com/get-docker/"
          tags: docker

    - name: Install mise
      block:
        - name: Install mise (Ubuntu/Debian)
          shell: |
            apt update -y && apt install -y curl
            install -dm 755 /etc/apt/keyrings
            curl -fSs https://mise.jdx.dev/gpg-key.pub | tee /etc/apt/keyrings/mise-archive-keyring.asc 1> /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.asc] https://mise.jdx.dev/deb stable main" | tee /etc/apt/sources.list.d/mise.list
            apt update -y
            apt install -y mise
          become: true
          when: ansible_facts.get("distribution") in ['Ubuntu', 'Debian', 'Pop', 'Linuxmint']
          tags: mise

        - name: Install mise on Fedora/RHEL (COPR)
          shell: |
            dnf -y install dnf-plugins-core
            dnf copr enable jdxcode/mise -y
            dnf install -y mise
          become: true
          when: ansible_facts.get("distribution") in ['Fedora', 'RedHat', 'CentOS', 'AlmaLinux', 'Rocky']
          tags: mise

        - name: Install mise on Arch
          package:
            name: mise
            state: present
          become: true
          when: ansible_facts.get("distribution") in ['Archlinux', 'Manjaro', 'EndeavourOS']
          tags: mise

        - name: Install mise on Alpine
          package:
            name: mise
            state: present
          become: true
          when: ansible_facts.get("distribution") == 'Alpine'
          tags: mise

        - name: Install mise on SUSE
          shell: |
            zypper refresh
            zypper install -y mise
          become: true
          when: ansible_facts.get("distribution") in ['openSUSE', 'SLES']
          tags: mise

        - name: Fallback - install mise via mise.run (shell installer)
          shell: |
            if ! command -v mise >/dev/null 2>&1; then
              curl -fsSL https://mise.run/zsh | MISE_INSTALL_PATH="$HOME/.local/bin" sh
            fi
          args:
            executable: /bin/bash
          tags: mise

      rescue:
        - name: Warn about mise installation failure
          debug:
            msg: "mise installation failed. Please install manually from https://mise.jdx.dev/installing-mise.html"
          tags: mise

    - name: Ensure mise activate present in .zshrc
      lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        regexp: 'eval .*mise activate zsh'
        line: 'eval "$(mise activate zsh)"'
        create: yes
      tags: mise

    - name: Ensure Oh My Zsh present
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: ohmyzsh_stat_2

    - name: Reinstall Oh My Zsh if missing
      shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      when: not ohmyzsh_stat_2.stat.exists

    - name: Check for existing Powerlevel10k
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
      register: p10k_stat

    - name: Backup existing Powerlevel10k if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: p10k_stat.stat.exists

    - name: Install Powerlevel10k theme
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
        version: master
        force: yes
      when: not ansible_check_mode

    - name: Check for existing zsh-syntax-highlighting
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
      register: zsh_syntax_stat

    - name: Backup existing zsh-syntax-highlighting if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: zsh_syntax_stat.stat.exists

    - name: Install zsh-syntax-highlighting plugin
      git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        version: master
        force: yes
      when: not ansible_check_mode

    - name: Check for existing zsh-autosuggestions
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
      register: zsh_autosug_stat

    - name: Backup existing zsh-autosuggestions if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: zsh_autosug_stat.stat.exists

    - name: Install zsh-autosuggestions plugin
      git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        version: master
        force: yes
      when: not ansible_check_mode

    - name: Check for existing zsh-history-substring-search
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-history-substring-search"
      register: zsh_hist_stat

    - name: Backup existing zsh-history-substring-search if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-history-substring-search" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-history-substring-search.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: zsh_hist_stat.stat.exists

    - name: Install zsh-history-substring-search plugin
      git:
        repo: https://github.com/zsh-users/zsh-history-substring-search.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-history-substring-search"
        version: master
        force: yes
      when: not ansible_check_mode

    - name: Check for existing zsh-autocomplete
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete"
      register: zsh_auto_stat

    - name: Backup existing zsh-autocomplete if present
      command: mv "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete" "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete.bak-{{ ansible_facts['date_time']['epoch'] }}"
      when: zsh_auto_stat.stat.exists

    - name: Install zsh-autocomplete plugin
      git:
        repo: https://github.com/marlonrichert/zsh-autocomplete.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autocomplete"
        version: main
        force: yes
      when: not ansible_check_mode

    - name: Prepare backups for stow conflicts
      shell: |
        set -euo pipefail
        pkg="{{ item }}"
        src="{{ ansible_facts['env']['HOME'] }}/.dotfiles/src/resources/$pkg"
        ts="{{ ansible_facts['date_time']['epoch'] }}"
        backup_dir="{{ ansible_facts['env']['HOME'] }}/.dotfiles-backups/$ts/$pkg"
        mkdir -p "$backup_dir"
        for f in $(cd "$src" && find . -mindepth 1 -maxdepth 1 -printf '%P\n'); do
          tgt="{{ ansible_facts['env']['HOME'] }}/$f"
          if [ -e "$tgt" ]; then
            mkdir -p "$(dirname "$backup_dir/$f")"
            mv "$tgt" "$backup_dir/$f"
          fi
        done
      args:
        executable: /bin/bash
      loop: "{{ lookup('fileglob', playbook_dir + '/resources/*') | map('basename') | list }}"
      when: item is defined
      tags: stow

    - name: Stow all packages (safe overwrite)
      command: stow -t "{{ ansible_facts['env']['HOME'] }}" -R {{ item }}
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/src/resources"
      loop: "{{ lookup('fileglob', playbook_dir + '/resources/*') | map('basename') | list }}"
      ignore_errors: yes