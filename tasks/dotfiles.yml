---
- name: Ensure ~/.config exists (prevent stow tree-folding)
  ansible.builtin.file:
    path: "{{ home }}/.config"
    state: directory
    mode: "0755"

- name: Find stow packages
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/packages"
    file_type: directory
    depth: 1
  register: stow_packages

- name: Stow all packages (adopt existing files)
  ansible.builtin.command:
    cmd: "stow --adopt --dir={{ dotfiles_dir }}/packages --target={{ home }} {{ item.path | basename }}"
  loop: "{{ stow_packages.files }}"
  changed_when: false

- name: Restore dotfiles to repo versions after adopt
  ansible.builtin.command:
    cmd: git checkout -- .
    chdir: "{{ dotfiles_dir }}"
  changed_when: false

- name: Install mise tools
  ansible.builtin.shell:
    cmd: mise install
  environment:
    PATH: "{{ home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Install global pnpm packages
  ansible.builtin.shell:
    cmd: mise exec -- pnpm add -g gitmoji-cli gitmoji-changelog
  environment:
    PATH: "{{ home }}/.local/share/pnpm/bin:{{ home }}/.local/share/mise/shims:{{ home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    PNPM_HOME: "{{ home }}/.local/share/pnpm"
  changed_when: false
