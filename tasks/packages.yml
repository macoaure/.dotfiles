---
- name: Install pacman packages
  become: true
  ansible.builtin.command:
    cmd: pacman -S --needed --noconfirm base-devel make zsh git stow curl sudo re2c oniguruma libpng freetype2 libjpeg-turbo libwebp libzip libsodium sqlite openssl zlib bzip2
  changed_when: false

- name: Allow wheel group to run pacman without password
  become: true
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    dest: /etc/sudoers.d/10-wheel-pacman
    mode: "0440"
    validate: visudo -cf %s

- name: Check if yay is installed
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: yay_bin

- name: Clone yay-bin
  when: not yay_bin.stat.exists
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: /tmp/yay-bin
    depth: 1

- name: Build and install yay
  when: not yay_bin.stat.exists
  ansible.builtin.shell:
    cmd: makepkg -si --noconfirm
    chdir: /tmp/yay-bin
  changed_when: true

- name: Install AUR packages via yay
  ansible.builtin.command:
    cmd: yay -S --needed --noconfirm mise-bin github-cli
  changed_when: false
