---
- name: Check if running in WSL
  ansible.builtin.shell:
    cmd: grep -qi microsoft /proc/version && echo yes || echo no
  register: vscode_wsl_check
  changed_when: false

- name: Get Windows username
  when: vscode_wsl_check.stdout == "yes"
  ansible.builtin.shell:
    cmd: cmd.exe /c 'echo %USERNAME%' 2>/dev/null | tr -d '\r\n'
  register: vscode_win_username
  changed_when: false

- name: Ensure Windows VS Code User settings directory exists
  when: vscode_wsl_check.stdout == "yes"
  ansible.builtin.file:
    path: "/mnt/c/Users/{{ vscode_win_username.stdout }}/AppData/Roaming/Code/User"
    state: directory
    mode: "0755"

- name: Ensure Windows Cursor User settings directory exists
  when: vscode_wsl_check.stdout == "yes"
  ansible.builtin.file:
    path: "/mnt/c/Users/{{ vscode_win_username.stdout }}/AppData/Roaming/Cursor/User"
    state: directory
    mode: "0755"

- name: Copy settings to Windows VS Code
  when: vscode_wsl_check.stdout == "yes"
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/packages/vscode/.config/Code/User/settings.json"
    dest: "/mnt/c/Users/{{ vscode_win_username.stdout }}/AppData/Roaming/Code/User/settings.json"
    mode: "0644"

- name: Copy settings to Windows Cursor
  when: vscode_wsl_check.stdout == "yes"
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/packages/cursor/.config/Cursor/User/settings.json"
    dest: "/mnt/c/Users/{{ vscode_win_username.stdout }}/AppData/Roaming/Cursor/User/settings.json"
    mode: "0644"
